name: Deployment Flow

on:
  # Automated trigger for Testing
  pull_request:
    types: [closed]
    
  # Manual trigger for Production with interactive inputs
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: 'Deploy all changes or cherry-pick?'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - Cherry-pick
      commit_sha:
        description: 'Commit SHAs for cherry-pick (comma or space separated)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------
  # 1. AUTOMATED FLOW (Runs only on PR Merge)
  # ---------------------------------------------------------
  build-branch:
      if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
      runs-on: ubuntu-latest
      steps:
          - name: Download target branch code
            uses: actions/checkout@v4
            with:
              ref: ${{ github.base_ref }}
              fetch-depth: 0
          
          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: '24'

          - name: Install Dependencies
            run: |
              echo "Installing dependencies"
              npm install
          
          - name: Run Vite Build Check
            run: |
              echo "Running Vite build for testing environment"
              if ! npm run build; then
                echo "ERROR: Vite build broke! Halting testing deployment."
                exit 1
              fi
              echo "Build successful! Proceeding to deployment."

          - name: Upload Artifact
            uses: actions/upload-artifact@v4
            with: 
              name: vite-build-artifact
              path: dist/
              retention-days: 1
              
  deploy-testing:
      if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
      runs-on: ubuntu-latest
      needs: build-branch
      environment: testing
      steps:
        - name: Download Build Artifact
          uses: actions/download-artifact@v4
          with:
            name: vite-build-artifact
            path: dist/

        - name: Deploying to testing env
          run: |
            BRANCH_NAME="release-pr-${{ github.event.pull_request.number }}"
            echo "Automatically deploying $BRANCH_NAME to TESTING env..."
  
  # ---------------------------------------------------------
  # 2. MANUAL PRODUCTION FLOW (Runs only via workflow_dispatch)
  # ---------------------------------------------------------
  deploy-production:
      if: github.event_name == 'workflow_dispatch'
      runs-on: ubuntu-latest
      environment: production # Still requires environment approval if configured in repo settings
      steps:
        - name: Validate Inputs
          run: |
            if [ "${{ inputs.deploy_mode }}" == "Cherry-pick" ] && [ -z "${{ inputs.commit_sha }}" ]; then
              echo "ERROR: You selected 'Cherry-pick' but did not provide any commit SHAs."
              exit 1
            fi
            
        - name: Checkout Code (Target Branch)
          uses: actions/checkout@v4
          with:
            ref: 'dev' # Or main/master, depending on what you deploy to prod
            fetch-depth: 0

        - name: Setup Git for Cherry-Pick
          if: inputs.deploy_mode == 'Cherry-pick'
          run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

        - name: Apply Cherry-Picks
          if: inputs.deploy_mode == 'Cherry-pick'
          run: |
            echo "Preparing to cherry-pick commits: ${{ inputs.commit_sha }}"
            
            # Use the unique GitHub run ID for the branch name to avoid spaces/special characters
            git checkout -b prod-cherry-pick-${{ github.run_id }}
            
            # Replace any commas with spaces to handle both format types smoothly
            COMMIT_SHAS=$(echo "${{ inputs.commit_sha }}" | tr ',' ' ')
            
            # Loop through each SHA and apply it
            for SHA in $COMMIT_SHAS; do
              echo "----------------------------------------"
              echo "Evaluating commit: $SHA"
              
              if git rev-list --parents -n 1 $SHA | grep -q " .* "; then
                echo "Merge commit detected! Applying with '-m 1' to follow the mainline branch."
                git cherry-pick -m 1 $SHA
              else
                echo "Standard commit detected. Applying normal cherry-pick."
                git cherry-pick $SHA
              fi
            done
            
            echo "----------------------------------------"
            echo "All cherry-picks applied successfully!"
            
        - name: Setup Node.js (Rebuild for Prod)
          uses: actions/setup-node@v4
          with:
            node-version: '24'

        - name: Install and Build
          run: |
            echo "Running fresh build for Production ($MODE mode)..."
            npm install
            npm run build
          env:
            MODE: ${{ inputs.deploy_mode }}

        - name: Deploy to Production Environment
          run: |
            echo "Deploying to PRODUCTION..."
            echo "Mode: ${{ inputs.deploy_mode }}"
            if [ "${{ inputs.deploy_mode }}" == "Cherry-pick" ]; then
              echo "Deployed specific commits: ${{ inputs.commit_sha }}"
            else
              echo "Deployed all standard changes."
            fi
            # Add your production deployment commands here (e.g., AWS, Vercel, SCP)