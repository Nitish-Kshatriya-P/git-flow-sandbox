name: Deployment Flow

on:
    pull_request:
        types: [closed]
        branches:
            - dev

permissions:
    contents: write

jobs:
    deploy-testing:
        if: github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        environment: testing
        steps:
            - name: Download dev branch code
              uses: actions/checkout@v4
              with:
                ref: dev
            
            - name: Create and push release branch
              run: |
                BRANCH_NAME = "release-pr-${{ github.event.pull_request.number }}"
                echo "Cutting new release branch: $BRANCH_NAME"

                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"

                git checkout -b $BRANCH_NAME
                git push origin $BRANCH_NAME

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'

            - name: Install Dependencies
              run: |
                echo "Installing dependencies"
                npm install
            
            - name: Run Vite Build Check
              run: |
                echo "Running Vite build for testing environment"

                if ! npm run build; then
                  echo "ERROR: Vite build broke! Halting testing deployment."
                  exit 1
                fi

                echo "Build successful! Proceeding to deployment."

            - name: Deploying to testing env
              if: success()
              run: |
                BRANCH_NAME="release-pr-${{ github.event.pull_request.number }}"
                echo "🚀 Automatically deploying $BRANCH_NAME to TESTING env..."
    
    deploy-production:
        runs-on: ubuntu-latest
        needs: deploy-testing    
        environment: production
        steps:
        - name: Download Release Branch Code
          uses: actions/checkout@v4
          with:
            ref: release-pr-${{ github.event.pull_request.number }}
            
        # We must build the project again on the production runner
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            
        - name: Install Dependencies & Build for Production
          run: |
            echo "📦 Installing production dependencies..."
            npm install
            
            echo "🔨 Running Vite production build..."
            
            # Explicitly check if the build fails on the production runner
            if ! npm run build; then
                echo "ERROR: Vite build broke on production runner! Halting production deployment."
                exit 1 
            fi
            
            echo "Production Build successful!"
            
        - name: Deploy to Production Environment
          if: success()
          run: |
            BRANCH_NAME="release-pr-${{ github.event.pull_request.number }}"
            echo "🌍 Manual approval received!"
            echo "Deploying $BRANCH_NAME to PRODUCTION..."